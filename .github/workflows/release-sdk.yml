name: Release SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish: 1.0.0"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
      dry-run:
        description: "Dry run (no publish)"
        required: false
        type: boolean
        default: false

jobs:
  ci:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        run: vp run --filter @danielfrg/things-sdk build

      - name: Typecheck SDK
        run: vp run --filter @danielfrg/things-sdk typecheck

  release:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        run: |
          node -e "const fs = require('node:fs'); const path = 'packages/sdk/package.json'; const pkg = JSON.parse(fs.readFileSync(path, 'utf8')); pkg.name = '@danielfrg/things-sdk'; pkg.version = '${{ inputs.version }}'; pkg.private = false; pkg.publishConfig = { ...(pkg.publishConfig || {}), access: 'public' }; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Generate SDK
        run: vp run --filter @danielfrg/things-sdk build

      - name: Typecheck SDK
        run: vp run --filter @danielfrg/things-sdk typecheck

      - name: Publish to npm (dry run)
        if: ${{ inputs['dry-run'] }}
        working-directory: packages/sdk
        run: npm publish --tag ${{ inputs.tag }} --dry-run

      - name: Publish to npm
        if: ${{ !inputs['dry-run'] }}
        working-directory: packages/sdk
        run: npm publish --tag ${{ inputs.tag }} --access public --provenance

      - name: Create GitHub Release
        if: ${{ !inputs['dry-run'] }}
        run: gh release create "sdk-v${{ inputs.version }}" --generate-notes --title "SDK v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
